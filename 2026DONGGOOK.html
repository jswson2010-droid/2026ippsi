# 동국대학교 입시설명회 교사 연수 상세 분석 자료

> 본 자료는 동국대학교 서울캠퍼스(학생부 서류평가 해설) 및 와이즈캠퍼스(전형 안내) 교사 연수 내용을 종합 정리한 것입니다.

---

## 1. 동국대학교 서울캠퍼스 — 학생부 종합전형 개요

### 1-1. 주요 전형 종류

| 전형명 | 전형 특징 | 비고 |
|--------|-----------|------|
| **두드림 전형** | 1단계 서류(4배수) → 2단계 면접(30%) | 대규모 모집 / 자기주도 학습역량 중시 |
| **학교장 추천 인재 전형** | 서류 평가 위주, 상위 10개 과목 정량 + 서류 정성 30% | 충원율 높음 / 서류 평가 영향력 큼 |
| **학교장 추천 인재(교과) 전형** | 교과 정량 평가 중심 | 2028년부터 성취도 반영 추가 |

## 3. 경영대학 합격·불합격 학생 사례 분석

### 3-1. 두드림 전형 — 지원자 A, B, C 비교

| 구분 | 지원자 A (2등 합격) | 지원자 B (1등 합격) | 지원자 C (두드림 불합격 / 학추인 충원 합격) |
|------|-------------------|-------------------|--------------------------------------|
| 평균 등급 | 2.06등급 | 2.2등급 | 우수 등급 (구체 수치 미공개) |
| 특징 | 수학 관련 과목 다수 이수 (1학년: 자연계열 고려 → 2학년 이후 수학 심화 + 경영 희망) | 전공 적합성 두드러짐, 서류 평가 상위권 | 두드림·학추인 복수 지원 |
| 주요 이수 과목 | 공동교육과정 **국제경제** | 경제, **심화수학 1** (3학년 1학기) | — |
| 서류 평가 강점 | 학습의 주도성, 전공 수학 역량 | 기초 학업 역량 (특히 영어 성취 우수) | 기초 학업 역량, 전공 수학 역량 |
| 서류 평가 약점 | — | 학습의 주도성 (A 대비 다소 낮음) | 전공 관심도 (관심 분야가 너무 넓게 퍼짐, 깊이 아쉬움) |

### 3-2. 학교장 추천 인재 전형 — 지원자 D 사례

- 교과 전형 + 학교장 추천 인재 전형 동시 지원
- C 학생보다 높은 순위에 충원 합격
- **상위 10개 과목 평균 1.2등급**, 기초 교과(국영수) 평균 **1.86등급**
- 기초 학업 역량에서 우수한 성적으로 합격

> **오해 주의:** 학교장 추천 인재 전형의 정량 평가가 상위 10개 과목을 반영하더라도, **서류 평가(30%)에서는 전체 과목과 전체 등급대를 모두 확인**합니다.

## 4. 서류 평가 6대 항목 및 점수 체계

동국대 서류 평가는 아래 **6개 영역** 기준으로 평가됩니다.

| 항목 | 설명 |
|------|------|
| 기초 학업 역량 | 국어·영어·수학 등 기초 교과 성취 수준 |
| 전공 수학 역량 | 지원 학과와 연관된 수학·과학 등 교과 역량 |
| 학습의 주도성 | 스스로 과목을 선택하고 탐구하는 자기주도 학습 태도 |
| 전공 적합성 | 지원 전공에 대한 관심·탐색·심화 활동의 일관성 |
| 전공 관심도 | 전공 관련 활동의 깊이와 구체성 |
| 인성 및 사회성 | 공동체 활동, 리더십, 역할 수행 태도 |

**점수 기준:** S = 7점, A = 6점, B = 5점 (육각형 그래프로 합격자 평균과 비교)

- 전공 이해도보다는 **입학 후 학습에 필요한 기초 학업 역량(수학·물리)**을 우선 평가
- 생명과학 집중 이수 학생은 전공 수학 역량 측면에서 불리할 수 있음

## 6. 입학사정관의 학생부 평가 3단계 플로우

동국대 사정관은 학생부를 다음 3단계 순서로 평가합니다.

1. **무엇을 학습하였는가?**
   - 교육과정 편제표(나이스 등록 과목 기준) 확인
   - 어떤 과목을 어떤 상황에서 선택했는지 파악
   - 편제표는 3학년 1학기(8월 31일 기준)까지만 반영됨

2. **어떻게 학습하였는가?**
   - 세부능력 및 특기사항(세특) 확인
   - 교과 학습 발달 상황(원점수·성취도·수강자 수·편차·과목 평균 등) 종합 분석
   - 단순 등급 숫자가 아닌 **그 등급의 맥락(소수 수강, 어려운 과목 선택 등)** 을 평가

3. **왜 학습하였는가?**
   - 진로 탐색과 과목 선택의 연결성
   - 전공 관련 고민의 일관성과 깊이
   - 교과 활동과 창체의 유기적 연결 여부

> **주의:** 세특에 미분방정식 등 대학 수준 개념을 억지로 넣는 것은 오히려 역효과입니다. 고등학교 수준에서 학생이 진정성 있게 탐구한 내용이 훨씬 높은 평가를 받습니다.

---

## 7. 교육과정 편제표 관련 유의사항

- 대학에 제공되는 편제표는 **칸막이(선택 그룹 정보) 없이 개설 과목 리스트**만 제공됨
- 공동교육과정 과목은 **개설 주체 학교의 편제표에만 표기**됨 (수강 학생 본교 편제표에는 없음)
- **전학생의 경우** 졸업 학교 편제표만 반영 → 학적 사항도 함께 확인 필요
- 3학년 2학기 개설 과목은 반영되지 않음

## 8. 2028학년도 전형 변화 요약

### 8-1. 주요 전형별 변화

| 전형 | 변화 내용 |
|------|-----------|
| **학생부 종합(두드림)** | 2단계 면접 비율 **30% → 40%**로 상향 |
| **학생부 교과(학교장 추천 인재)** | 수능 최저 학력 기준 미적용 유지, 고교별 추천 인원 **폐지** |
| **논술 전형** | 광역화 모집 단위 중심 재편 |
| **수능(정시)** | 가·나·다군 모두 **학생부 평가 20% 반영** 신설 |

### 8-2. 수시·정시 비율 변화

- **수시 비율 약 70%로 확대**, 정시 30%로 축소
- 증원 인원의 상당수가 **두드림 전형 + 학교장 추천 인재 전형**에 배정 예정

### 8-3. 교과 전형 정량 평가 변화 (2028학년도~)

- 기존: 상위 10개 과목 **등급**만 반영
- 변경: 등급 + **성취도** 함께 반영

| 환산 점수 영역 | 조건 |
|--------------|------|
| 영역 1 (최고) | 1등급 + 성취도 A 또는 B |
| 영역 1 (최고) | **2등급 + 성취도 A** (기존보다 유리해짐) |

- 반영 과목: **2학년 이후 이수 과목** (1학년 공통 과목 제외)

### 8-4. 2028학년도 대입 전형 자료 추가 항목

기존 자료에 더해 아래 정보가 대학에 추가로 제공됨:

- 지필 평가 비율 / 수행 평가 비율
- 수행 평가 영역명
- 성취도별 분할 점수

> **오해 금지:** 이 자료는 학교나 교사를 평가하는 것이 아니라, 학생의 세특을 더 잘 해석하기 위한 **보조 자료**입니다. 수행 평가 영역명의 명칭(예: "회귀 분석하기" 등)이 평가에 유리하게 작용하지 않습니다.

## 9. 정시(수능 전형) 학생부 20% 반영 안내

- 2028학년도부터 **가·나·다군 정시에서 학생부 평가 20% 반영**
- 수능 전형의 취지를 유지하면서도, 지원 학과 관련 활동과 학교생활 성실성을 추가 반영
- 수능을 준비하면서도 학교생활을 성실히 유지한 학생에게 유리
- 자세한 기준은 입학처 홈페이지 참조

## 10. 동국대학교 와이즈캠퍼스(경주) — 메디컬 계열 전형 안내

### 10-1. 학교 및 캠퍼스 특징

- **경상북도 유일 의과대학** 보유
- 메디컬 계열: 의예과, 한의학과, 간호학과 (와이즈캠퍼스 소속)
- **전과 제도 매우 활성화:** 횟수 제한 없음, 1학년 1학기부터 신청 가능 → 1학년 2학기부터 전과 가능
- **글로벌 인재학부(자유전공학부):** 1학년 2학기 또는 2학년 진급 시 전공 결정 가능 (메디컬·사범 계열 제외 모든 학과 선택 가능)

### 10-2. 전년도 입시 결과 — 한의학과·의예과·간호학과

| 학과 | 고교 유형 | 교과 전형 등급 | 종합 전형 등급 | 특이사항 |
|------|----------|-------------|-------------|---------|
| 의예과 | 일반고 절대 다수 | 1점 초반대 | 1점 중후반대 | 자사고 일부 합격 |
| 한의학과 | 일반고 절대 다수 | 1점 초반대 | 1점 중후반대 | — |
| 간호학과 | — | 3점대 (최근 하락) | 지역인재 4점대 | 인원 증가로 입결 하락 |

### 10-3. 수능 최저 학력 기준

| 학과 | 기존 수능 최저 | 2027학년도 변경 사항 |
|------|-------------|-------------------|
| 의예과 | 3합 4 | **수학 지정과목 폐지** (확통 가능, 과탐 1과목) |
| 한의학과 | 3합 5 | **수학 지정과목 폐지** (사탐 1과목도 가능) |
| 간호학과 | 2합 8 | **2합 7**로 완화 |

- 과탐 가산점: 생탐·화탐 각 **5%**
- 수능 최저 충족률이 합불의 가장 큰 변수

### 10-4. 와이즈캠퍼스 전형 안내

| 전형명 | 선발 방식 | 주요 대상 |
|--------|----------|----------|
| 학업 성적 우수자 전형 | 교과 성적 100% (전 과목) | 교과 100% 전형 |
| **학교 생활 우수 전형 (신설)** | 교과 성적 70% + 서류 평가 30% (상위 10과목) | 간호학과 + 일반 계열 |
| 면접 전형 | 교과 70% + 면접 30% | 중하위권 학생 적극 고려 |
| 불교 추천 인재 전형 | 교과 전형 100%와 동일 | 추천서 제출 |
| 참사랑 전형 (종합) | 서류 70% + 면접 30% | 메디컬 계열 종합 전형 |
| 농어촌·특성화·기회균형 | 교과 성적 100% | 해당 특별 전형 |

> **면접 전형 특이사항:** 매년 2문제 출제, **일주일 전 홈페이지에 문제 공개** → 면접 부담 사실상 없음

## 11. 합격 학생 공통 특성 — AI 분석 결과

동국대 입학처가 합격 수기를 분석(GPT 활용)한 결과, 아래 7가지 공통 특성이 도출되었습니다.

1. **수업 중심 준비** — 수행 평가, 조별 활동, 교과 탐구 등 정규 수업이 핵심
2. **배운 내용의 확장 탐구** — 개념 이해 → 스스로 심화 고민
3. **지속적인 진로 고민** — 고정된 목표가 아닌 관심 분야를 탐색하며 성장
4. **특정 직업보다 관심 분야 중심** — 직업 목표보다 분야에 대한 관심으로 접근
5. **교과와 창체의 유기적 연결** — 교과 활동이 창의적 체험활동과 자연스럽게 연결
6. **학습의 주도성** — 스스로 과목 선택·고민·결정하는 태도
7. **균형 잡힌 성장** — 한 분야 집중이 아닌 다방면의 역량 발달
8. (교사의 역할) 위 1~7의 모습을 관찰하고 **진정성 있게 기록**
